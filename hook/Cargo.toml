[package]
name = "nutils-hook"
version = "4.0.0"
edition = "2021"
description = "In-process auto-hide helper DLL for NUtils (injected into designated apps via SetWindowsHookEx)"
license = "GPL-3.0-or-later"

[lib]
name = "nutils_hook"
crate-type = ["cdylib"]

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
]
