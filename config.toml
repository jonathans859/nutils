# NUtils settings (sample). The live copy sits next to nutils.exe and is created
# on first run; after that, NUtils never writes it: what it records as it runs (the
# auto-transparent apps, the hidden windows) goes to state.toml beside it.
#
# Hotkey syntax: ^ = Ctrl, + = Shift, # = Win, ! = Alt, then a key; named keys
# in braces like {f4}, {esc}. Every shortcut is the base modifier plus its key.
# To give one shortcut its own modifiers, include them (e.g. chtitle = "^+t");
# an empty value ("") removes the shortcut.

rules = []

[hotkeys]
base = "!+"          # the base modifier: Shift+Alt
# slots = "^+"       # own modifiers for the slot keys 1..0 ("" turns them off)
# priority = "^+"    # own modifiers for the priority keys F3..F8 ("" turns them off)
stackdown = "-"      # previous stack
stackup = "="        # next stack
chtitle = "t"        # change active window's title
transparent = '\'   # make active window transparent (invisible)
solid = "/"          # make active window solid again
firstavailhide = "h" # hide active window in the first free slot
winkill = "{f4}"     # kill active window's process
manageapp = "a"      # start auto-transparenting the active window's app
unmanageapp = "s"    # stop auto-transparenting it (and make its windows solid again)
status = "i"         # speak how many windows are hidden in how many stacks

[settings]
stack_counter = true     # true: beep N times on stack N; false: use number sound pack
feedback = "beeps"       # "beeps" | "text" | "both"  (text/both speak via NVDA, else SAPI)
detailed_status = false  # true: the status hotkey also names each hidden window
                         # (stack, position and title) instead of just the counts.
                         # Status is always spoken, even in "beeps" mode.
visual_check = false     # true: when a hotkey makes a window transparent, also
                         # compare the screen before and after, and say so if
                         # the window is still visible. Needs Screen Curtain off.

