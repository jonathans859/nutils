name: Build

# Windows runners bill double on a private repo, so this avoids work it doesn't
# need: doc-only changes don't run it, a newer push cancels an older run, NUtils
# is built once, and the settings editor (wxWidgets) is only rebuilt when its
# own sources change.

on:
  push:
    branches: [master]
    paths:
      - '**'
      - '!docs/**'
      - '!**.md'
      - 'README.md' # ships in the artifact, so it does rebuild
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!**.md'
      - 'README.md' # ships in the artifact, so it does rebuild
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # The injected helper DLL needs no extra toolchain.
      - name: Build hook DLL
        run: cargo build --release -p nutils-hook

      # Tests use the plain build: build.rs delay-loads Prism's vendor DLLs for
      # the program only, so a speech-enabled test binary wouldn't start here.
      - name: Test
        run: cargo test --release -p nutils

      # The shipped nutils.exe speaks through Prism, which implements NVDA's RPC
      # protocol itself -- so the artifact needs no nvdaControllerClient64.dll
      # beside it. cmake/prism.cmake pins Prism to the static CRT to match this
      # repo's +crt-static; PRISM_STATIC=1 links Prism in rather than as a DLL.
      - name: Build nutils with Prism speech
        env:
          PRISM_STATIC: "1"
          CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}\cmake\prism.cmake
        run: cargo build --release -p nutils --features speech

      # The settings editor only changes when these files do, so reuse the last
      # built exe when they haven't: the artifact is always complete, and
      # wxWidgets is only touched when the editor really needs rebuilding.
      - name: Reuse settings editor
        id: settings-exe
        uses: actions/cache@v4
        with:
          path: target/release/nutils-settings.exe
          key: settings-exe-${{ runner.os }}-${{ hashFiles('settings/**', 'src/config.rs', 'Cargo.lock', 'Cargo.toml', '.cargo/config.toml') }}

      # Building it compiles wxWidgets from source: needs CMake (preinstalled on
      # the runner), Ninja, and libclang for bindgen. LLVM is preinstalled at
      # C:\Program Files\LLVM.
      - name: Install Ninja
        if: steps.settings-exe.outputs.cache-hit != 'true'
        run: choco install ninja -y

      # Cache the compiled wxWidgets so it isn't rebuilt from source every time
      # (~20 min cold -> a couple of minutes warm). wxdragon-sys writes its CMake
      # output to the dirs named by these env vars; we cache them, keyed on the
      # locked dependency versions. GitHub drops caches unused for 7 days, so the
      # first editor build after a quiet week is cold again.
      - name: Cache wxWidgets build
        if: steps.settings-exe.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: .wxbuild
          key: wxwidgets-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            wxwidgets-${{ runner.os }}-

      - name: Build settings editor
        if: steps.settings-exe.outputs.cache-hit != 'true'
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
          WXDRAGON_SYS_BUILD_DIR: ${{ github.workspace }}\.wxbuild\sys
          WXWIDGETS_BUILD_DIR: ${{ github.workspace }}\.wxbuild\wx
        run: cargo build --release -p nutils-settings

      # Gather everything into one folder so the zip is flat: the binaries plus
      # the README, which doubles as the user guide.
      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/nutils.exe, target/release/nutils_hook.dll, `
            target/release/nutils-settings.exe, README.md dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          # Downloads as nutils.zip; each run keeps its own artifact.
          name: nutils
          path: dist/
          if-no-files-found: error
