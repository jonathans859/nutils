name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # The core and the injected helper DLL need no extra toolchain.
      - name: Build core + hook DLL
        run: cargo build --release -p nutils -p nutils-hook

      - name: Test
        run: cargo test --release -p nutils

      # The settings editor builds wxWidgets from source: needs CMake (preinstalled
      # on the runner), Ninja, and libclang for bindgen. LLVM is preinstalled at
      # C:\Program Files\LLVM.
      - name: Install Ninja
        run: choco install ninja -y

      - name: Build settings editor
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: cargo build --release -p nutils-settings

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nutils-${{ github.sha }}
          path: |
            target/release/nutils.exe
            target/release/nutils_hook.dll
            target/release/nutils-settings.exe
          if-no-files-found: error
