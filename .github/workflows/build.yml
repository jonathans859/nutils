name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # The core and the injected helper DLL need no extra toolchain.
      - name: Build core + hook DLL
        run: cargo build --release -p nutils -p nutils-hook

      - name: Test
        run: cargo test --release -p nutils

      # The settings editor builds wxWidgets from source: needs CMake (preinstalled
      # on the runner), Ninja, and libclang for bindgen. LLVM is preinstalled at
      # C:\Program Files\LLVM.
      - name: Install Ninja
        run: choco install ninja -y

      # Cache the compiled wxWidgets so it isn't rebuilt from source every run
      # (~20 min cold -> a couple of minutes warm). wxdragon-sys writes its CMake
      # output to the dirs named by these env vars; we cache them, keyed on the
      # locked dependency versions.
      - name: Cache wxWidgets build
        uses: actions/cache@v4
        with:
          path: .wxbuild
          key: wxwidgets-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            wxwidgets-${{ runner.os }}-

      - name: Build settings editor
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
          WXDRAGON_SYS_BUILD_DIR: ${{ github.workspace }}\.wxbuild\sys
          WXWIDGETS_BUILD_DIR: ${{ github.workspace }}\.wxbuild\wx
        run: cargo build --release -p nutils-settings

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nutils-${{ github.sha }}
          path: |
            target/release/nutils.exe
            target/release/nutils_hook.dll
            target/release/nutils-settings.exe
          if-no-files-found: error
