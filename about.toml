# cargo-about: collects the licenses of every crate built into the release, for
# THIRD-PARTY-NOTICES.txt (generated by CI, shipped in nutils.zip). Only
# licenses compatible with NUtils' GPL-3.0-or-later are accepted, so a new
# dependency under anything else fails the build instead of shipping quietly.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "0BSD",
    "Unlicense",
    "MPL-2.0",
    "LGPL-2.1-or-later",
    "GPL-3.0-or-later",
    # webpki-roots: the root certificates the updater trusts for HTTPS. A
    # permissive data license that only asks for its text to be included.
    "CDLA-Permissive-2.0",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# NUtils' own crates (publish = false) are covered by LICENSE, not listed here.
private = { ignore = true }
