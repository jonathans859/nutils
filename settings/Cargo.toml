[package]
name = "nutils-settings"
version = "4.0.0"
edition = "2021"
description = "Accessible settings dialog for NUtils (wxWidgets via wxDragon)"
license = "GPL-3.0-or-later"
repository = "https://github.com/jonathans859/nutils"
publish = false

[[bin]]
name = "nutils-settings"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
wxdragon = "0.9.21"
# Updates from GitHub Releases, verified with minisign (same library Fedra uses).
ship-shape = "0.2.0"
accesskit = "0.24"

# Screen-reader live-region announcements for the key-capture dialog (as Fedra does).
[target.'cfg(windows)'.dependencies]
accesskit_windows = "0.34"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader", # tests: hold a DLL loaded
] }
