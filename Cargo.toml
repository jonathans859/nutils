[package]
name = "nutils"
version = "4.0.1"
edition = "2021"
description = "Hotkey-controlled window manager for screen-reader users (modern Rust rewrite of NUtils)"
license = "GPL-3.0-or-later"
repository = "https://github.com/jonathans859/nutils"
publish = false
authors = [
    "Niko Carpenter",
    "Tyler Spivey",
    "Rust rewrite: Jonathan Schuster <accounts@jonathan859.com>",
]

[[bin]]
name = "nutils"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Text-to-speech / screen-reader feedback via Prism, through the prismer
# bindings. Optional because its native build needs CMake and a C++23 compiler,
# plus the Visual Studio "C++ ATL" component for some backends. Linked
# statically, so nutils.exe needs no prism.dll beside it.
# Build with `--features speech` to enable it.
prismer = { version = "0.1.3", features = ["static"], optional = true }

[features]
default = []
speech = ["dep:prismer"]

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_Media_Speech",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Media_Audio",
    "Win32_Globalization",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
embed-resource = "3.0.11"

[workspace]
members = ["settings", "hook"]
resolver = "2"
